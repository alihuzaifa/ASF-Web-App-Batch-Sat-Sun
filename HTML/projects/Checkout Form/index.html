<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f5f7;
            color: #1d1f24;
        }

        header {
            background-color: #1d1f24;
            color: white;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
        }

        .page {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .box {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .cart {
            flex: 1 1 380px;
        }

        .details {
            flex: 1 1 480px;
        }

        h2 {
            margin-top: 0;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #e6e8ec;
        }

        .item img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item .name {
            flex: 1;
            font-weight: bold;
        }

        .item .qty {
            color: #6b7080;
            font-size: 14px;
            font-weight: normal;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            padding-top: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 14px 0 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #cfd3da;
            border-radius: 8px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row div {
            flex: 1;
        }

        .pay label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pay input {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #4f46e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4338ca;
        }

        .credit {
            text-align: center;
            color: #8a8f9c;
            font-size: 12px;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <header>My Shop</header>

    <div class="page">

        <!-- What the customer is buying -->
        <div class="box cart">
            <h2>Your cart</h2>

            <div class="item">
                <img src="images/shoes.jpg" alt="White heels">
                <div class="name">White Heels <br><span class="qty">Qty: 1</span></div>
                <div>Rs 4,500</div>
            </div>

            <div class="item">
                <img src="images/controller.jpg" alt="Game controller">
                <div class="name">Game Controller <br><span class="qty">Qty: 1</span></div>
                <div>Rs 6,000</div>
            </div>

            <div class="item">
                <img src="images/camera.jpg" alt="Film camera">
                <div class="name">Film Camera <br><span class="qty">Qty: 1</span></div>
                <div>Rs 12,000</div>
            </div>

            <div class="total">
                <span>Total</span>
                <span>Rs 22,500</span>
            </div>
        </div>

        <!--
            FormSubmit sends this form to your email. No backend needed.

            1. Put YOUR email after formsubmit.co/ in action="..."
            2. Open this page with Live Server (not by double-clicking the file).
            3. Submit once. FormSubmit emails you an "Activate Form" link. Click it.
            4. From now on, every order lands in your inbox.

            Every input needs a name="...". The name is what you see in the email.
        -->
        <form class="box details" action="https://formsubmit.co/your-email@example.com" method="POST">
            <h2>Delivery details</h2>

            <!-- Hidden settings for FormSubmit -->
            <input type="hidden" name="_subject" value="New order #MS-1024 - Rs 22,500">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">

            <!--
                The order as a receipt. FormSubmit shows values in a fixed-width
                font, so lining the columns up with spaces makes a neat bill.
                Keep it at the start of the line: spaces here end up in the email.
            -->
            <textarea name="Order" hidden>
ORDER #MS-1024
------------------------------------
Item                 Qty      Price
------------------------------------
White Heels            1   Rs  4,500
Game Controller        1   Rs  6,000
Film Camera            1   Rs 12,000
------------------------------------
Delivery                        FREE
TOTAL                      Rs 22,500</textarea>

            <label for="name">Full name</label>
            <input type="text" id="name" name="Customer" placeholder="Ali Khan" required>

            <div class="row">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div>
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="Phone" placeholder="0300 1234567" required>
                </div>
            </div>

            <label for="address">Address</label>
            <textarea id="address" name="Address" rows="3" placeholder="House, street, area" required></textarea>

            <label for="city">City</label>
            <select id="city" name="City" required>
                <option value="">Choose your city</option>
                <option>Karachi</option>
                <option>Lahore</option>
                <option>Islamabad</option>
                <option>Peshawar</option>
                <option>Quetta</option>
            </select>

            <label>Payment</label>
            <div class="pay">
                <label><input type="radio" name="Payment" value="Cash on delivery" checked> Cash on delivery</label>
                <label><input type="radio" name="Payment" value="Bank transfer"> Bank transfer</label>
            </div>

            <button type="submit">Place order</button>
        </form>
    </div>

    <p class="credit">Photos: Alejandro Escamilla, Pawel Kadysz, Nicola Perantoni on Unsplash</p>
</body>

</html>
